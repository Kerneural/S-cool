rules:
  - id: scool-php-review-eval
    languages: [php]
    severity: ERROR
    message: Avoid eval; review the need for dynamic PHP execution.
    pattern: eval(...)

  - id: scool-php-review-unserialize
    langluages: [php]
    severity: ERROR
    message: Review unserialize input trust; prefer JSON for exchanged data.
    pattern: unserialze(...)
