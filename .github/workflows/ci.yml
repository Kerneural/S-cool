name: S-cool CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: CI/ Runner Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify repository files
        run: |
          pwd
          git rev-parse HEAD
          test -f composer.json
          test -f docker-compose.yml
          echo "Repository files are present."
      - name: Inspect runner tools
        run: |
          uname -a
          docker version
          docker compose version

      - name: Build PHP runtime image
        run: |
          docker build --progress=plain \
           -f docker/php/Dockerfile \
            -t scool-php:ci .
          docker run --rm scool-php:ci php --version

      - name: Install and build frontend
        run: |
          node --version
          npm --version
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Install PHP dependencies
        run: |
          docker run --rm \
            -v "$PWD:/var/www/html" \
            scool-php:ci \
            composer install --no-interaction --prefer-dist

          test -f vendor/autoload.php

      - name: Check dependency security
        run: |
          npm audit --audit-level=high

          docker run --rm \
            -v "$PWD:/var/www/html" \
            scool-php:ci \
            composer audit --locked

      - name: Check PHP formatting
        run: |
          docker run --rm \
          -v "$PWD:/var/www/html" \
          scool-php:ci \
          composer run pint:test

      - name: Start test services
        run: |
          docker compose -p scool up -d \
            --wait --wait-timeout 120 \
            mysql mailpit

          docker compose -p scool ps

      - name: Prepare Laravel environment
        run: |
          test ! -e .env
          cp .env.example .env

          docker run --rm \
          -v "$PWD:/var/www/html" \
          scool-php:ci \
          php artisan key:generate --no-interaction

      - name: Run application test
        run: |
          docker run --rm \
            --network scool_scool-network \
            -v "$PWD:/var/www/html" \
            -e APP_ENV=testing \
            -e DB_DATABASE=scool_test \
            scool-php:ci \
            php artisan test \
              --fail-on-skipped \
              --fail-on-empty-test-suite

      - name: Stop test services
        if: always()
        run: |
          docker compose -p scool down --remove-orphans
