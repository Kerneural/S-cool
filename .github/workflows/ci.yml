name: S-cool CI

on:
    pull_request:
        branches: ["main"]
    push:
        branches: ["main"]
    workflow_dispatch:


permissions: read-all

jobs:
    preflight:
        name: CI/ Runner Preflight
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        steps:
            - name: Inspect runner tools
              run: |
                  uname -a
                  docker version
                  docker compose version